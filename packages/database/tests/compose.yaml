services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipoint_database_test
      POSTGRES_USER: ipoint_test
      POSTGRES_PASSWORD: ipoint_test
      TZ: UTC
    ports:
      - '55440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipoint_test -d ipoint_database_test']
      interval: 2s
      timeout: 3s
      retries: 20
