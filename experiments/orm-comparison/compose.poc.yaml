name: ipoint-orm-poc

services:
  prisma-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipoint_prisma_poc
      POSTGRES_USER: ipoint_poc
      POSTGRES_PASSWORD: ipoint_poc
    ports:
      - '55431:5432'
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - deadlock_timeout=100ms
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipoint_poc -d ipoint_prisma_poc']
      interval: 2s
      timeout: 3s
      retries: 30

  drizzle-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipoint_drizzle_poc
      POSTGRES_USER: ipoint_poc
      POSTGRES_PASSWORD: ipoint_poc
    ports:
      - '55432:5432'
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - deadlock_timeout=100ms
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipoint_poc -d ipoint_drizzle_poc']
      interval: 2s
      timeout: 3s
      retries: 30
