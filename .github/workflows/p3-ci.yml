# Phase 3 CI — Multi-Market Wallet & Reward Ledger
name: Phase 3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'phase/3-**'
      - 'task/p3-**'
  pull_request:
    branches:
      - 'phase/3-**'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: p3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgresql://ipoint:ipoint_ci@127.0.0.1:5432/ipoint_ci
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  quality:
    name: Quality (format + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --reporter verbose

  phase3-tests:
    name: Phase 3 module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- apps/api/src/wallet --reporter verbose
      - run: pnpm test -- apps/api/src/reward --reporter verbose
      - run: pnpm test -- apps/api/src/transaction-reward --reporter verbose
      - run: pnpm test -- apps/api/src/daily-job --reporter verbose
      - run: pnpm test -- apps/api/src/admin-reward --reporter verbose
      - run: pnpm test -- apps/api/src/__tests__/ledger-invariants --reporter verbose
      - run: pnpm test -- apps/api/src/__tests__/concurrency --reporter verbose
      - run: pnpm test -- apps/api/src/__tests__/timezone --reporter verbose
      - run: pnpm test -- apps/api/src/__tests__/cross-module --reporter verbose
      - run: pnpm test -- tests/contract --reporter verbose
      - run: pnpm test -- tests/security --reporter verbose

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ipoint_ci
          POSTGRES_USER: ipoint
          POSTGRES_PASSWORD: ipoint_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipoint -d ipoint_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:checksum
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm db:drift
      - run: pnpm test:database
      - run: pnpm db:checksum
      - run: pnpm db:drift

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ipoint_api_ci
          POSTGRES_USER: ipoint
          POSTGRES_PASSWORD: ipoint_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipoint -d ipoint_api_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ipoint:ipoint_api_ci@127.0.0.1:5432/ipoint_api_ci
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:api
