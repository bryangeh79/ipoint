# Phase 3 CI — Multi-Market Wallet & Reward Ledger
# Trigger: push to phase/3-* branches
# Runs: install, format:check, lint, typecheck, build, test (with PostgreSQL service container)

name: Phase 3 CI

on:
  push:
    branches:
      - 'phase/3-**'
  pull_request:
    branches:
      - 'phase/3-**'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: p3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.9'
  DATABASE_URL: postgresql://ipoint:ipoint_ci@127.0.0.1:5432/ipoint_ci
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  quality:
    name: Quality (format + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test -- --reporter verbose

  database-tests:
    name: Database tests (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ipoint_ci
          POSTGRES_USER: ipoint
          POSTGRES_PASSWORD: ipoint_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipoint -d ipoint_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify immutable migration checksums
        run: pnpm db:checksum
      - name: Migrate empty database
        run: pnpm db:migrate
      - name: Seed database (idempotent)
        run: pnpm db:seed && pnpm db:seed
      - name: Verify schema drift
        run: pnpm db:drift
      - name: Run database tests
        run: pnpm test:database
      - name: Verify database after tests
        run: pnpm db:checksum && pnpm db:drift

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ipoint_api_ci
          POSTGRES_USER: ipoint
          POSTGRES_PASSWORD: ipoint_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipoint -d ipoint_api_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Run API tests
        run: pnpm test:api
